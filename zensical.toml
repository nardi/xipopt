[project]
site_url = "https://nardi.github.io/xipopt/"
site_name = "xipopt"
site_description = "Ipopt for JAX functions, called through the PJRT C API"
site_author = "Nardi Lam"
repo_url = "https://github.com/nardi/xipopt"
repo_name = "nardi/xipopt"

nav = [
  { "Introduction" = "index.md" },
  { "Installation" = "installation.md" },
  { "Guide" = [
    { "Basic usage" = "guide/basic.md" },
    { "Parameters and warm starts" = "guide/parameters.md" },
    { "Derivatives and sparsity" = "guide/derivatives.md" },
    { "Options and callbacks" = "guide/options.md" },
    { "Saving and loading" = "guide/saving.md" },
    { "Performance" = "guide/performance.md" },
  ] },
  { "Design" = "design.md" },
  { "API reference" = [
    { "Problems" = "api/problems.md" },
    { "Compiling and solving" = "api/solving.md" },
    { "Options" = "api/options.md" },
    { "Results and statistics" = "api/results.md" },
  ] },
  { "Development" = "development.md" },
  { "References" = "references.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
filters = ["!^_", "!^wrap$"]
show_root_heading = true
show_root_full_path = false
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
