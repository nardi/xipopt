[project]
site_url = "https://nardi.github.io/xipopt/"
site_name = "xipopt"
site_description = "Ipopt for JAX functions, called through the PJRT C API"
site_author = "Nardi Lam"
repo_url = "https://github.com/nardi/xipopt"
repo_name = "nardi/xipopt"

nav = [
  { "Introduction" = "index.md" },
  { "Installation" = "installation.md" },
  { "Guide" = [
    { "Basic usage" = "guide/basic.md" },
    { "Parameters and warm starts" = "guide/parameters.md" },
    { "Problem state" = "guide/problem-state.md" },
    { "Derivatives and sparsity" = "guide/derivatives.md" },
    { "Options and callbacks" = "guide/options.md" },
    { "Saved problems" = "guide/saving.md" },
    { "Libraries with their own kernels" = "guide/libraries.md" },
    { "Performance" = "guide/performance.md" },
  ] },
  { "Design" = "design.md" },
  { "API reference" = [
    { "Problems" = "api/problems.md" },
    { "Compiling and solving" = "api/solving.md" },
    { "Options" = "api/options.md" },
    { "Results and statistics" = "api/results.md" },
  ] },
  { "Development" = "development.md" },
  { "References" = "references.md" },
]

# The dropdown of the page title that switches to the other documentation sites,
# which the theme lists by default.
[project.extra.site_switcher]
current = "xipopt"

[project.theme]
language = "en"
# The Tufte theme comes from the `theme` submodule and extends the built-in theme. It
# loads its own fonts, so the built-in theme loads none from Google Fonts.
custom_dir = "theme/zensical_tufte"
font = false
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

# The directory of the theme contains two files of its Python packaging, which the site
# does not need.
[project.plugins.exclude]
glob = ["mkdocs_theme.yml", "__init__.py", "__pycache__/*"]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
filters = ["!^_", "!^wrap$"]
show_root_heading = true
show_root_full_path = false
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
